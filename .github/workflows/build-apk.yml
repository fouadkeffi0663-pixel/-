name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q namotok-fixed.zip -d extracted

      - name: Find project folder
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name package.json -type f | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: namotok-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
